{% extends "base.html" %}
{% block title %}Nuevo Evento — Rodeo de Cría{% endblock %}
{% block content %}

<div class="card" style="border-top: 4px solid var(--amber);">
  <div class="card-title">📋 Cargar evento reproductivo</div>

  <div id="vaca-info" style="display:none; margin-bottom:14px;"></div>

  <form id="form-evento">
    <div class="form-group">
      <label>IDE de la vaca</label>
      <input type="text" name="ide_vaca" id="ide_vaca" placeholder="858000..."
             inputmode="numeric" autocomplete="off" autocorrect="off"
             value="{{ request.args.get('ide','') }}">
      <div id="ide-check" style="font-size:13px; margin-top:5px;"></div>
    </div>

    <div class="form-group">
      <label>Temporada</label>
      <select name="temporada">
        <option value="2025" selected>2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
      </select>
    </div>

    <div class="form-group">
      <label>DAO sincronización</label>
      <select name="dao_sincro">
        <option value="">— sin dato —</option>
        <option>SUPERFICIAL</option>
        <option>CICLA</option>
        <option>PROFUNDO</option>
        <option>ENTORE</option>
      </select>
    </div>

    <div class="form-group">
      <label>Toro IATF</label>
      <select name="toro_iatf">
        <option value="">— sin IATF —</option>
        <option>ELEGIDO</option>
        <option>CELTA</option>
        <option>ESCOSES</option>
        <option>GEORDIE</option>
        <option>MARGINAL</option>
        <option>ROVER</option>
        <option>BIFE</option>
        <option>CORONEL SUAREZ</option>
        <option>ENTORE</option>
        {% for t in toros %}
        {% if t.idv %}<option value="{{ t.idv }}">{{ t.idv }}{% if t.notas %} ({{ t.notas[:20] }}){% endif %}</option>{% endif %}
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Diagnóstico IATF</label>
      <select name="diagnostico_iatf">
        <option value="">— sin dato —</option>
        <option>PRENA</option>
        <option>CICLA</option>
        <option>SUPERFICIAL</option>
        <option>PROFUNDO</option>
        <option>Preñada</option>
        <option>ENTORE</option>
      </select>
    </div>

    <div class="form-group">
      <label>Toro entore</label>
      <input type="text" name="toro_entore" placeholder="Nombre o número del toro" autocomplete="off">
    </div>

    <div class="form-group">
      <label>Eco entore</label>
      <select name="eco_entore">
        <option value="">— sin dato —</option>
        <option>GRANDE</option>
        <option>CHICA</option>
        <option>VACIA</option>
        <option>PREÑADA</option>
        <option>VENTA</option>
        <option>ABORTO</option>
      </select>
    </div>

    <div class="form-group">
      <label>Observaciones</label>
      <textarea name="observaciones" rows="2" placeholder="Opcional..."></textarea>
    </div>

    <button type="submit" class="btn btn-amber">✓ Guardar evento</button>
  </form>
</div>

<a href="/" class="btn btn-secondary mt-8">← Volver al inicio</a>

{% endblock %}
{% block extra_js %}
<script>
const idInput = document.getElementById('ide_vaca');
const check   = document.getElementById('ide-check');
const info    = document.getElementById('vaca-info');
let timer;

async function checkIde(v) {
  const res = await fetch(`/api/vaca/${v}`);
  const d   = await res.json();
  if (d.encontrada) {
    check.innerHTML = `<span style="color:var(--green)">✓ Encontrada</span>`;
    info.style.display = 'block';
    info.innerHTML = `<div class="alert alert-success"><strong>${d.ide}</strong> — ${d.clase||'?'} — Año ${d.anio||'?'}</div>`;
  } else {
    check.innerHTML = `<span style="color:var(--red)">✗ No encontrada</span>`;
    info.style.display = 'none';
  }
}

if (idInput.value.length > 6) checkIde(idInput.value);

idInput.addEventListener('input', () => {
  clearTimeout(timer);
  const v = idInput.value.replace(/\s/g,'');
  if (v.length < 8) { check.textContent=''; info.style.display='none'; return; }
  timer = setTimeout(() => checkIde(v), 500);
});

document.getElementById('form-evento').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('.btn-amber');
  btn.textContent = 'Guardando...'; btn.disabled = true;
  await postForm('/evento/nuevo', e.target, (d) => {});
  btn.textContent = '✓ Guardar evento'; btn.disabled = false;
});
</script>
{% endblock %}
