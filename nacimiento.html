{% extends "base.html" %}
{% block title %}Registrar Parto — Rodeo de Cría{% endblock %}
{% block content %}

<div class="card" style="border-top: 4px solid var(--green);">
  <div class="card-title">🐮 Registrar parto a campo</div>

  <div id="vaca-info" style="display:none; margin-bottom:14px;"></div>

  <form id="form-nacimiento">
    <div class="form-group">
      <label>IDE de la madre (caravana)</label>
      <input type="text" name="ide_madre" id="ide_madre" placeholder="858000..." inputmode="numeric"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <div id="ide-check" style="font-size:13px; margin-top:5px; color: var(--text-s);"></div>
    </div>

    <div class="form-group">
      <label>Nro. caravana ternero</label>
      <input type="text" name="caravana" placeholder="Ej: 312" inputmode="numeric" autocomplete="off">
    </div>

    <div class="form-group">
      <label>Sexo</label>
      <select name="sexo">
        <option value="">— seleccionar —</option>
        <option value="M">Macho (M)</option>
        <option value="H">Hembra (H)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Potrero</label>
      <select name="potrero">
        <option value="">— seleccionar —</option>
        {% for p in potreros %}
        <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Raza</label>
      <select name="raza">
        <option value="">— seleccionar —</option>
        {% for r in razas %}
        <option value="{{ r }}" {% if r=='AA' %}selected{% endif %}>{{ r }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Semana de parición</label>
      <input type="text" name="semana" placeholder="Ej: 1 al 7 / 8 al 14" autocomplete="off">
    </div>

    <input type="hidden" name="temporada" value="2025">

    <button type="submit" class="btn btn-primary">✓ Guardar parto</button>
  </form>
</div>

<a href="/" class="btn btn-secondary mt-8">← Volver al inicio</a>

{% endblock %}
{% block extra_js %}
<script>
const idInput = document.getElementById('ide_madre');
const check   = document.getElementById('ide-check');
const info    = document.getElementById('vaca-info');
let timer;

idInput.addEventListener('input', () => {
  clearTimeout(timer);
  const v = idInput.value.replace(/\s/g,'');
  if (v.length < 8) { check.textContent=''; info.style.display='none'; return; }
  timer = setTimeout(async () => {
    const res = await fetch(`/api/vaca/${v}`);
    const d   = await res.json();
    if (d.encontrada) {
      check.innerHTML = `<span style="color:var(--green)">✓ Vaca encontrada</span>`;
      info.style.display = 'block';
      info.innerHTML = `<div class="alert alert-success">
        <strong>${d.ide}</strong> — ${d.clase || 'Sin clase'} — Año ${d.anio || '?'} — Estado: ${d.estado}
      </div>`;
    } else {
      check.innerHTML = `<span style="color:var(--red)">✗ Vaca no encontrada en el sistema</span>`;
      info.style.display = 'none';
    }
  }, 500);
});

document.getElementById('form-nacimiento').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('.btn-primary');
  btn.textContent = 'Guardando...'; btn.disabled = true;
  await postForm('/nacimiento', e.target, (d) => {
    e.target.reset();
    info.style.display = 'none';
    check.textContent = '';
  });
  btn.textContent = '✓ Guardar parto'; btn.disabled = false;
});
</script>
{% endblock %}
